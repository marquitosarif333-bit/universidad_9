<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Obligatorio | Universidad NovaTech del Valle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --bg-main: #fcf8f2;
            --green-ghibli: #2c5339;
            --terracotta: #9b3e22;
            --wood-dark: #1b2822;
            --border-soft: #d3cdbf;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, rgba(27, 40, 34, 0.9), rgba(44, 83, 57, 0.8)), url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=1400&q=80');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: var(--bg-main);
            width: 100%;
            max-width: 420px;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 2px solid var(--border-soft);
            text-align: center;
        }
        .login-logo {
            width: 55px; height: 55px;
            background: var(--green-ghibli);
            color: white;
            display: flex; align-items: center; justify-content: center;
            border-radius: 14px; font-size: 24px;
            margin: 0 auto 12px auto;
        }
        .login-card h1 { font-size: 22px; color: var(--wood-dark); margin-bottom: 2px; }
        .login-card p { font-size: 12px; color: #555555; margin-bottom: 15px; font-weight: 600; }
        
        .badge-ubicacion {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e8f0e9;
            color: var(--green-ghibli);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 20px;
            border: 1px solid #c8dbc9;
        }

        .campo-login { text-align: left; margin-bottom: 18px; }
        .campo-login label { display: block; font-size: 12px; font-weight: 700; color: var(--wood-dark); margin-bottom: 6px; }
        .input-grupo { position: relative; display: flex; align-items: center; }
        .input-grupo i { position: absolute; left: 12px; color: var(--green-ghibli); font-size: 14px; }
        .campo-login input {
            width: 100%; border: 1px solid var(--border-soft);
            border-radius: 8px; padding: 11px 12px 11px 38px;
            font-size: 13px; outline: none; background: #ffffff;
        }
        .btn-ingresar {
            width: 100%; border: none; background: var(--green-ghibli);
            color: white; padding: 12px; border-radius: 20px;
            font-weight: 800; font-size: 14px; cursor: pointer; transition: 0.3s;
            margin-top: 5px;
        }
        .btn-ingresar:hover { background: #1b2822; }
        #mensajeError {
            margin-top: 15px; font-size: 12px; font-weight: 700;
            color: var(--terracotta); display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo"><i class="fa-solid fa-tree"></i></div>
        <h1>UNOVA</h1>
        <p>Universidad NovaTech del Valle</p>
        
        <div class="badge-ubicacion">
            <i class="fa-solid fa-location-dot"></i> Región: México
        </div>

        <form id="formLogin">
            <div class="campo-login">
                <label for="usuario">Usuario / Correo</label>
                <div class="input-grupo">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="usuario" placeholder="Arif o correo" required>
                </div>
            </div>
            <div class="campo-login">
                <label for="password">Contraseña</label>
                <div class="input-grupo">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn-ingresar">Ingresar al Portal</button>
            <div id="mensajeError">Usuario o contraseña incorrectos.</div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            $("#formLogin").submit(function (e) {
                e.preventDefault();
                let usuario = $.trim($("#usuario").val());
                let password = $.trim($("#password").val());

                // Validación estricta solicitada
                if (usuario === "Arif" && password === "volovan_8hz") {
                    localStorage.setItem("unova_sesion_activa", "true");
                    $(".btn-ingresar").text("Acceso autorizado...").css("background", "#4a7c59");
                    setTimeout(function() {
                        // Redirige directamente al Inventario tras iniciar sesión
                        window.location.href = "inventario.html";
                    }, 800);
                } else {
                    $("#mensajeError").text("Usuario o contraseña incorrectos (Use: Arif / volovan_8hz)").fadeIn();
                    $("#password").val("");
                }
            });
        });
    </script>
</body>
</html>
